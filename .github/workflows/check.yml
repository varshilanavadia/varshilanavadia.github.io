name: Check

# Every pull request into main is tested and built the way GitHub Pages will build it, and
# fails if the tests fail, if the build is not fit to publish (scripts/check-build.mjs: no dev
# panel, only / and /404, analytics on the site's own address), or if thoughts.json breaks
# its rules against main (scripts/check-thoughts.mjs). CodeQL runs on pull requests too; this
# is the gate the rule protecting main is meant to require.
on:
  pull_request:
    branches: [main]
    # The default events, plus labelled and unlabelled, so the owner's thoughts-approved label
    # runs the check again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Pinned to commits, as in deploy.yml. The job is named check, not build, because the rule
# protecting main is to require it by name and deploy.yml already has a build job.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # No token left behind for npm's install scripts or the build to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The build is fit to publish
        run: node scripts/check-build.mjs
      # Against main as it stands. A correction to an earlier thought's text passes only once
      # the owner has labelled the pull request thoughts-approved; it is listed either way.
      # The base branch and the label come in through env, never into the script itself.
      - name: thoughts.json holds to its rules
        env:
          BASE_REF: ${{ github.base_ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'thoughts-approved') }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:src/data/thoughts.json > "$RUNNER_TEMP/thoughts-before.json"
          if [ "$APPROVED" = true ]; then allow=--allow-edits; else allow=; fi
          node scripts/check-thoughts.mjs "$RUNNER_TEMP/thoughts-before.json" src/data/thoughts.json $allow
