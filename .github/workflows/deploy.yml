name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no code of ours, may publish.
permissions:
  contents: read

# One deploy at a time. A newer push queues behind a running one rather than cancelling it
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

# Every action is pinned to a commit, not a tag: a tag can be moved to other code, and this
# workflow publishes the site. Dependabot (.github/dependabot.yml) proposes new pins.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The same install and build as check.yml, so the site publishes by the recipe the pull
      # request's check passed: npm ci installs exactly what package-lock.json lists. No token
      # is left behind for npm's install scripts or the build to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The same gate as the pull request's check, so a push straight to main is held to it
      # too; if it fails, nothing is uploaded and the site already live stays up.
      - name: The build is fit to publish
        run: node scripts/check-build.mjs
      # Against the main this push replaced. Corrections pass here: the owner approved them on
      # the pull request. A first push, or a run started by hand, has nothing to compare with.
      - name: thoughts.json holds to its rules
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "No earlier main to compare with."
          elif git fetch --quiet --depth=1 origin "$BEFORE" && git show FETCH_HEAD:src/data/thoughts.json > "$RUNNER_TEMP/thoughts-before.json"; then
            node scripts/check-thoughts.mjs "$RUNNER_TEMP/thoughts-before.json" src/data/thoughts.json --allow-edits
          else
            echo "The earlier main has no thoughts.json to compare with."
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
          # As withastro/action did, so a dot-file such as public/.well-known/… still publishes.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
