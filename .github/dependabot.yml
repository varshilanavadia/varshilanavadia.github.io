# Weekly pull requests for newer npm packages and newer pinned actions. Each one goes through
# check.yml like any other change, and merging it publishes, so it needs the same go-ahead.
# check.yml never runs the two Pages actions, so a bad bump of either fails only when
# deploying after the merge, and the site already live stays up.
# The cooldown skips releases younger than a week: a hijacked release is usually caught and
# pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    # TypeScript stays at 6 until Astro's checker (@astrojs/check) runs on 7: on 7 it can't
    # load, and scripts/typecheck.mjs fails every check. Drop this once it supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
